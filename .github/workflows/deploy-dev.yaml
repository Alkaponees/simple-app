name: Secret Scanning with TruffleHog

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
workflow_dispatch: 

jobs:
   ScanSecrets:
    name: Scan secrets=
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: trufflehog-actions-scan
        uses: rufflesecurity/trufflehog-action@v1.6.1
        with:
          path: ./
          token: ${{ secrets.TRUFFLEHOG_GITHUB_TOKEN }}

